name: CI / DevSecOps

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1. Secretos: ningún token/clave versionado en todo el historial
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # 2. Backend: lint + pruebas unitarias y de API con cobertura
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --coverageReporters=text-summary --coverageReporters=lcov
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage/lcov-report }

  # 3. Flujo e2e contra una MongoDB real
  e2e:
    name: Backend e2e (MongoDB)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      MONGO_URI: mongodb://localhost:27017/footballhub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run test:e2e

  # 4. Frontend: lint + pruebas + build
  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }

  # 5. SCA: dependencias con vulnerabilidades conocidas (falla en high/critical)
  dependencies:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: frontend

  # 6. SAST: análisis estático de seguridad
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/javascript --config p/nodejs --config p/react --config p/owasp-top-ten --error --metrics=off --exclude node_modules --exclude '**/tests/**'

  # 7. DAST: la app compilada se levanta y OWASP ZAP la ataca (baseline)
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/footballhub_dast
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - run: npm ci --omit=dev
        working-directory: backend
      - name: Start app (production mode)
        run: |
          export JWT_ACCESS_SECRET=$(openssl rand -hex 32) JWT_REFRESH_SECRET=$(openssl rand -hex 32)
          nohup node backend/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-report, path: zap }
